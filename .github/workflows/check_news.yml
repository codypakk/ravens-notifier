name: Check Ravens News

on:
  schedule:
    # Runs every 30 minutes (UTC)
    - cron: "*/30 * * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-notifier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Run news notifier
        run: uv run ravens_notifier.py

      - name: Commit seen news cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_news.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update seen news cache [skip ci]"
          git push
