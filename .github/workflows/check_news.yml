name: Check Ravens News

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

# Grant write permissions so the bot can commit seen_news.txt back to main
permissions:
  contents: write

jobs:
  check-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: Run Ravens Notifier Script
        run: |
          python ravens_notifier.py

      - name: Commit Updated Seen News Cache
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_news.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Chore: update seen news cache [skip ci]" && git push)
