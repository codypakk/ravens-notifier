name: feed update

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: # Enables the manual "Run workflow" button in GitHub Actions

permissions:
  contents: write # Required to commit changes back to the repository

jobs:
  check-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Run Ravens Notifier Script
        run: uv run ravens_notifier.py

      - name: Commit seen_news.txt changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update seen_news.txt cache"
          file_pattern: "seen_news.txt"
