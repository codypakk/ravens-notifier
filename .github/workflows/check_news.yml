name: Check Ravens News

on:
  schedule:
    # Runs at minutes 7 and 37 past every hour (UTC) to avoid peak minute congestion
    - cron: "7,37 * * * *"
  workflow_dispatch: # Enables manual trigger button under the Actions tab in GitHub UI

# Grants write permissions so the bot can save seen_news.txt back to the repository
permissions:
  contents: write

jobs:
  run-notifier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Run news notifier
        run: uv run ravens_notifier.py

      - name: Commit seen news cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_news.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update seen news cache [skip ci]"
          git push
